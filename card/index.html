<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lauren Young · Lets Connect</title>
<meta name="description" content="Reach Lauren Young: email, LinkedIn and Instagram.">
<meta property="og:type" content="profile">
<meta property="og:title" content="Lauren Young">
<meta property="og:description" content="Email, LinkedIn and Instagram.">
<meta property="og:image" content="https://lt-young.github.io/koi-orange.png">
<link rel="icon" href="../nav-icon.png" type="image/png">
<meta name="theme-color" content="#0a6f80">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=boska@401&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400&display=swap">
<style>
  /* Her Figma "Contact card v2": a heading, two line icons and the email, straight on the pond. Nothing else. */
  :root {
    --pond: oklch(0.47 0.08 210);
    --ink: oklch(0.98 0.02 185);
    --ink-soft: oklch(0.98 0.02 185 / 0.72);
    --koi: oklch(0.70 0.17 50);
    --shade: drop-shadow(0 1px 2px rgb(0 40 50 / 0.45));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--pond); }
  body {
    margin: 0; min-height: 100dvh; color: var(--ink); font: 400 18px/1.4 "Crimson Text", Georgia, serif;
    background: var(--pond) url(../works-water.webp?v=3) 0 0 / 720px auto repeat;
    animation: drift 90s linear infinite;
  }
  @keyframes drift { to { background-position: 720px 512px; } }
  #koi { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  a, button { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--koi); outline-offset: 4px; border-radius: 4px; }

  .home { position: fixed; top: 14px; left: 16px; z-index: 2; display: block; width: 40px; filter: var(--shade); transition: rotate .6s cubic-bezier(.2,.7,.2,1); }
  .home img { width: 100%; height: auto; display: block; }
  .home:hover { rotate: -8deg; }

  main {
    position: relative; z-index: 1; min-height: 100dvh; display: grid; align-content: center; justify-items: start;
    gap: clamp(28px, 3vw, 44px); padding: 64px 28px 96px clamp(28px, 13.9vw, 200px);
  }
  h1 { margin: 0; font: italic 400 clamp(60px, 7.6vw, 110px)/1 "Boska", Georgia, serif; letter-spacing: 0; filter: var(--shade); }
  .socials { display: flex; gap: clamp(28px, 2.8vw, 40px); }
  .socials a { display: block; width: clamp(34px, 2.8vw, 40px); aspect-ratio: 1; filter: var(--shade); transition: translate .2s; }
  .socials a:hover { translate: 0 -2px; }
  svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .email { display: flex; align-items: center; gap: clamp(14px, 1.4vw, 20px); filter: var(--shade); }
  .email a { font-size: clamp(24px, 2.5vw, 36px); text-decoration: none; overflow-wrap: anywhere; }
  .email a:hover { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .email button { flex: none; width: clamp(24px, 2.1vw, 30px); aspect-ratio: 1; padding: 0; border: 0; background: none; cursor: pointer; }
  .copied { margin: -16px 0 0; min-height: 1.4em; font-size: 16px; color: var(--ink-soft); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { body { animation: none; } }
</style>
</head>
<body>
<canvas id="koi" aria-hidden="true"></canvas>
<a class="home" href="../" aria-label="Back to the pond"><img src="../lotus-nav.png" alt=""></a>

<main>
  <h1>Lets Connect</h1>
  <nav class="socials" aria-label="Find me online">
    <a href="https://www.linkedin.com/in/lauren-young-1b3002341/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="3"/><path d="M7.5 10.5v6M7.5 7.5v.01M11.5 16.5v-6M11.5 13c0-1.6 1.1-2.5 2.4-2.5s2.1.9 2.1 2.5v3.5"/></svg></a>
    <a href="https://www.instagram.com/1aurstudios_/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><path d="M17.3 6.7v.01"/></svg></a>
  </nav>
  <div class="email">
    <a href="mailto:lauren888young@gmail.com">lauren888young@gmail.com</a>
    <button type="button" id="copy" aria-label="Copy email address"><svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="1.5"/><path d="M15.5 8.5V5a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 5v9A1.5 1.5 0 0 0 5 15.5h3.5"/></svg></button>
  </div>
  <p class="copied" id="copied" aria-live="polite"></p>
</main>

<script>
(() => {
  const EMAIL = 'lauren888young@gmail.com';
  const copy = document.getElementById('copy'), note = document.getElementById('copied');
  copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(EMAIL); note.textContent = 'copied'; }
    catch { note.textContent = EMAIL; }
    clearTimeout(copy.t); copy.t = setTimeout(() => note.textContent = '', 2400);
  });

  // one koi drifting through the pond, under everything
  const cv = document.getElementById('koi'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = { img: new Image(), face: -0.70, len: 240, t: 0, sp: 0.05 };
  f.img.src = '../koi-orange.png';
  let W = 0, H = 0, dpr = 1;
  function fit() { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; }
  fit(); addEventListener('resize', fit);
  // a slow loop over the right side of the screen so it stays clear of the words on the left
  function path(t) { const cx = W < 700 ? W * 0.5 : W * 0.68, rx = W < 700 ? W * 0.34 : W * 0.22, ry = H * 0.36;
    const cy = W < 700 ? H * 0.8 : H * 0.55, ry2 = W < 700 ? H * 0.1 : ry;   // on phones it stays in the water below the words
    return [cx + Math.cos(t) * rx + Math.sin(t * 2.3) * 30, cy + Math.sin(t) * ry2 + Math.cos(t * 1.7) * (W < 700 ? 20 : 40)]; }
  let last = null;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = last === null ? 0 : Math.min(0.05, (now - last) / 1000); last = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    if (!f.img.complete || !f.img.naturalWidth) return;
    f.t += dt * f.sp * (reduce ? 0 : 1);
    const [x, y] = path(f.t), [x2, y2] = path(f.t + 0.01);
    const head = Math.atan2(y2 - y, x2 - x) + Math.sin(now / 420) * 0.06;
    const s = Math.min(1, W / 700) * f.len / Math.hypot(f.img.naturalWidth, f.img.naturalHeight) * 1.25;
    const w = f.img.naturalWidth * s, h = f.img.naturalHeight * s;
    ctx.save(); ctx.translate(x, y); ctx.rotate(head - f.face);
    ctx.shadowColor = 'rgba(0,35,45,0.3)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 10;
    ctx.drawImage(f.img, -w / 2, -h / 2, w, h); ctx.restore();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
