<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lauren Young · Lets Connect</title>
<meta name="description" content="Reach Lauren Young: email, LinkedIn and Instagram.">
<meta property="og:type" content="profile">
<meta property="og:title" content="Lauren Young">
<meta property="og:description" content="Email, LinkedIn and Instagram.">
<meta property="og:image" content="https://lt-young.github.io/koi-orange.png">
<link rel="icon" href="../nav-icon.png" type="image/png">
<meta name="theme-color" content="#0a6f80">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=boska@301&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400&display=swap">
<style>
  /* Her Figma "Contact card v2": a heading, two line icons and the email, straight on the pond. Nothing else. */
  :root {
    --pond: oklch(0.47 0.08 210);
    --ink: oklch(0.98 0.02 185);
    --ink-soft: oklch(0.98 0.02 185 / 0.72);
    --koi: oklch(0.70 0.17 50);
    --shade: drop-shadow(0 1px 2px rgb(0 40 50 / 0.45));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--pond); }
  body {
    margin: 0; min-height: 100dvh; color: var(--ink); font: 400 18px/1.4 "Crimson Text", Georgia, serif;
    background: var(--pond) url(../works-water.webp?v=3) 0 0 / 720px auto repeat;
    animation: drift 90s linear infinite;
  }
  @keyframes drift { to { background-position: 720px 512px; } }
  #koi { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  a, button { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--koi); outline-offset: 4px; border-radius: 4px; }

  .home { position: fixed; top: 14px; left: 16px; z-index: 2; display: block; width: 40px; filter: var(--shade); transition: rotate .6s cubic-bezier(.2,.7,.2,1); }
  .home img { width: 100%; height: auto; display: block; }
  .home:hover { rotate: -8deg; }

  main {
    position: relative; z-index: 1; min-height: 100dvh; display: grid; align-content: center; justify-items: start;
    gap: clamp(28px, 3vw, 44px); padding: 64px 28px 96px clamp(28px, 13.9vw, 200px);
  }
  h1 { margin: 0; font: italic 300 clamp(60px, 7.6vw, 110px)/1 "Boska", Georgia, serif; letter-spacing: 0; filter: var(--shade); }
  .socials { display: flex; gap: clamp(28px, 2.8vw, 40px); }
  .socials a { display: block; width: clamp(34px, 2.8vw, 40px); aspect-ratio: 1; filter: var(--shade); transition: translate .2s; }
  .socials a:hover { translate: 0 -2px; }
  svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .email { display: flex; align-items: center; gap: clamp(14px, 1.4vw, 20px); filter: var(--shade); }
  .email a { font-size: clamp(24px, 2.5vw, 36px); text-decoration: none; overflow-wrap: anywhere; }
  .email a:hover { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .email button { flex: none; width: clamp(24px, 2.1vw, 30px); aspect-ratio: 1; padding: 0; border: 0; background: none; cursor: pointer; }
  .copied { margin: -16px 0 0; min-height: 1.4em; font-size: 16px; color: var(--ink-soft); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { body { animation: none; } }
</style>
</head>
<body>
<canvas id="koi" aria-hidden="true"></canvas>
<a class="home" href="../" aria-label="Back to the pond"><img src="../lotus-nav.png" alt=""></a>

<main>
  <h1>Lets Connect</h1>
  <nav class="socials" aria-label="Find me online">
    <a href="https://www.linkedin.com/in/lauren-young-1b3002341/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="3"/><path d="M7.5 10.5v6M7.5 7.5v.01M11.5 16.5v-6M11.5 13c0-1.6 1.1-2.5 2.4-2.5s2.1.9 2.1 2.5v3.5"/></svg></a>
    <a href="https://www.instagram.com/1aurstudios_/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><path d="M17.3 6.7v.01"/></svg></a>
  </nav>
  <div class="email">
    <a href="mailto:lauren888young@gmail.com">lauren888young@gmail.com</a>
    <button type="button" id="copy" aria-label="Copy email address"><svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="1.5"/><path d="M15.5 8.5V5a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 5v9A1.5 1.5 0 0 0 5 15.5h3.5"/></svg></button>
  </div>
  <p class="copied" id="copied" aria-live="polite"></p>
</main>

<script src="../koi-swim.js?v=1"></script>
<script>
(() => {
  const EMAIL = 'lauren888young@gmail.com';
  const copy = document.getElementById('copy'), note = document.getElementById('copied');
  copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(EMAIL); note.textContent = 'copied'; }
    catch { note.textContent = EMAIL; }
    clearTimeout(copy.t); copy.t = setTimeout(() => note.textContent = '', 2400);
  });

  // her two koi, swimming exactly as on the rest of the site (same rig, same swim, same size as on "currently"),
  // round one wide loop that circles the words and never leaves the screen
  const cv = document.getElementById('koi'), gl = cv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: true });
  if (!gl || !window.KoiSwim) return;
  const KS = window.KoiSwim, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const vs = `attribute vec2 p; attribute vec2 uv; varying vec2 v; uniform vec2 res;
    void main(){ v = uv; gl_Position = vec4(p.x / res.x * 2.0 - 1.0, 1.0 - p.y / res.y * 2.0, 0.0, 1.0); }`;
  const fs = `precision mediump float; varying vec2 v; uniform sampler2D t; void main(){ gl_FragColor = texture2D(t, v); }`;
  const sh = (ty, src) => { const o = gl.createShader(ty); gl.shaderSource(o, src); gl.compileShader(o); return o; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);
  const aP = gl.getAttribLocation(prog, 'p'), aUV = gl.getAttribLocation(prog, 'uv'), uRes = gl.getUniformLocation(prog, 'res');
  gl.uniform1i(gl.getUniformLocation(prog, 't'), 0);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(KS.IDX), gl.STATIC_DRAW);

  let W = 0, H = 0, dpr = 1, SC = 1, LOOP = null;
  const KOI = KS.siteKoi('../');
  function fit() {
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    SC = 0.68 * Math.min(W / 1440, H / 1024);      // the main site's frame, fitted to the screen, at the zoom of its inner pages
    const m = Math.max(250 * SC, 56);                           // inset so fins and tail stay on screen all the way round
    LOOP = KS.superLoop(W / 2, H / 2, Math.max(W / 2 - m, 180 * SC), Math.max(H / 2 - m, 180 * SC), 2 / 2.6);
    KOI.forEach(k => { if (!k.ready) return;      // a new window size: carry on from the same point of the lap
      const f = (k.plan.u - (k.td[k.td.length - 1] - k.dist)) / k.plan.loop.P; KS.startTrack(k, LOOP, f * LOOP.P, SC); });
  }
  fit();
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fit, 150); });
  function potCanvas(img) { const c = document.createElement('canvas'); c.width = 2048; c.height = 2048; const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, 2048, 2048); return c; }
  KOI.forEach((o, i) => { const img = new Image(); img.onload = () => {
    const k = KOI[i] = Object.assign(KS.rig(Object.assign(o, { texW: img.width, texH: img.height })), { ready: true });
    k.uvb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, k.uvb); gl.bufferData(gl.ARRAY_BUFFER, k.uv, gl.STATIC_DRAW);
    k.pb = gl.createBuffer(); k.tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, k.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, potCanvas(img)); gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    KS.startTrack(k, LOOP, k.lap0 * LOOP.P + LOOP.P * 0.37, SC);
  }; img.src = o.src; });

  let last = null, t = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = last === null ? 0 : Math.min(0.05, (now - last) / 1000); last = now;
    const go = reduce ? 0 : dt; t += go;
    gl.viewport(0, 0, cv.width, cv.height); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uRes, W, H);
    for (const k of KOI) {
      if (!k.ready) continue;
      KS.pose(k, t, go, KOI.find(o => o !== k && o.ready));
      gl.bindBuffer(gl.ARRAY_BUFFER, k.pb); gl.bufferData(gl.ARRAY_BUFFER, k.pos, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, k.uvb); gl.enableVertexAttribArray(aUV); gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 0, 0);
      gl.bindTexture(gl.TEXTURE_2D, k.tex);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.drawElements(gl.TRIANGLES, KS.IDX.length, gl.UNSIGNED_SHORT, 0);
    }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
